<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#141511">
  <meta name="description" content="Abhishek’s personal checklist, daily goal planner, and yearly progress tracker.">
  <title>Abhishek’s Daily Tracker</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a href="#main" class="skip">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <a href="#today" class="brand"><span class="mark" aria-hidden="true">✓</span><span>Daily Tracker</span></a>
      <nav aria-label="Main navigation" id="nav"></nav>
      <span class="sidebar-name" id="sidebar-name">Abhishek Kumar</span>
    </aside>
    <div class="surface">
      <header class="topbar">
        <span class="mobile-name"><span class="mark" aria-hidden="true">✓</span> Daily Tracker</span>
        <span class="desktop-name">Abhishek’s Daily Tracker</span>
        <span id="status" role="status" class="status">Opening tracker…</span>
      </header>
      <main id="main" tabindex="-1"><p>Opening your checklist…</p></main>
    </div>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
</body>
</html>
