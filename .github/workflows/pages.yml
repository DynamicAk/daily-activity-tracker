name: Test and deploy GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run test:rules
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the tracker
        run: |
          mkdir -p pages/app
          cp index.html pages/
          cp app/*.js app/style.css pages/app/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy the tested site
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    needs: deploy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify the published tracker
        env:
          TRACKER_TEST_URL: ${{ needs.deploy.outputs.url }}
        run: |
          for attempt in {1..12}; do
            if curl -fsSL "$TRACKER_TEST_URL" -o live-index.html && grep -q 'src="app/app.js"' live-index.html; then
              npm run test:browser
              exit $?
            fi
            sleep 5
          done
          echo "GitHub Pages did not return the tracker entry page at $TRACKER_TEST_URL."
          exit 1
